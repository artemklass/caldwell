<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="800" height="800" fill="none">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#AE8625"/>
      <stop offset="30%" stop-color="#D2AC47"/>
      <stop offset="50%" stop-color="#F7EF8A"/>
      <stop offset="70%" stop-color="#D2AC47"/>
      <stop offset="100%" stop-color="#AE8625"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.8" flood-color="#C9A84C" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#C9A84C" flood-opacity="0.22"/>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <polygon points="20,1 39,20 20,39 1,20" fill="none" stroke="url(#gold)" stroke-width="0.8" opacity="0.85"/>
    <polygon points="20,7 33,20 20,33 7,20" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.4"/>
    <line x1="20" y1="10" x2="20" y2="30" stroke="url(#gold)" stroke-width="1.8"/>
    <line x1="10" y1="20" x2="30" y2="20" stroke="url(#gold)" stroke-width="1.8"/>
  </g>
</svg>
